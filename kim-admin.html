<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kim v6 — Quản lý Providers</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; }
  .card { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .btn { padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: .15s; border: none; }
  .btn-primary { background: #0f172a; color: #fff; }
  .btn-primary:hover { background: #1e293b; }
  .btn-danger { background: #fee2e2; color: #dc2626; }
  .btn-danger:hover { background: #fecaca; }
  .btn-sm { padding: 4px 12px; font-size: 12px; }
  input, textarea, select { border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px 12px; font-size: 14px; width: 100%; outline: none; }
  input:focus, textarea:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.1); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 600; }
  .badge-active { background: #dcfce7; color: #166534; }
  .badge-inactive { background: #fee2e2; color: #991b1b; }
  .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 10px; color: #fff; font-size: 14px; z-index: 100; animation: fadeIn .3s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body class="min-h-screen p-6">
<div id="app" class="max-w-4xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">⚙️ Kim v6 — Quản lý Providers</h1>
      <p class="text-sm text-slate-500 mt-1">Cấu hình API providers cho Thư ký Kim. Thay đổi có hiệu lực ngay (cache 5 phút).</p>
    </div>
    <button class="btn btn-primary" onclick="showAddForm()">+ Thêm Provider</button>
  </div>

  <!-- Token config -->
  <div class="card p-4 mb-4">
    <label class="block text-xs font-semibold text-slate-500 mb-1">Admin Token (KIM_ADMIN_TOKEN)</label>
    <input type="password" id="adminToken" placeholder="Nhập admin token để xác thực API calls" />
  </div>

  <!-- Provider list -->
  <div id="providerList" class="space-y-3">
    <div class="text-center py-8 text-slate-400">Đang tải...</div>
  </div>

  <!-- Add/Edit form (hidden by default) -->
  <div id="providerForm" class="card p-5 mt-4 hidden">
    <h2 id="formTitle" class="text-lg font-semibold mb-4">Thêm Provider mới</h2>
    <input type="hidden" id="editId" />
    <div class="grid grid-cols-2 gap-3 mb-3">
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Tên provider</label>
        <input id="fName" placeholder="vd: xkiro, openai-backup" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Priority (thấp = ưu tiên cao)</label>
        <input id="fPriority" type="number" value="0" />
      </div>
    </div>
    <div class="mb-3">
      <label class="block text-xs font-semibold text-slate-500 mb-1">Base URL</label>
      <input id="fBaseUrl" placeholder="https://api.xkiro.com/v1" />
    </div>
    <div class="mb-3">
      <label class="block text-xs font-semibold text-slate-500 mb-1">API Key (plaintext — sẽ được mã hóa trước khi lưu)</label>
      <input id="fApiKey" type="password" placeholder="sk-..." />
    </div>
    <div class="mb-3">
      <label class="block text-xs font-semibold text-slate-500 mb-1">Models (JSON array)</label>
      <textarea id="fModels" rows="6" placeholder='[{"id":"deepseek/deepseek-v4-pro","roles":["orchestrator"]}]'></textarea>
    </div>
    <div class="flex items-center gap-3 mb-4">
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="fActive" checked class="w-auto" /> Active</label>
    </div>
    <div class="flex gap-2">
      <button class="btn btn-primary" onclick="saveProvider()">Lưu</button>
      <button class="btn" style="background:#f1f5f9" onclick="hideForm()">Hủy</button>
    </div>
  </div>
</div>

<script>
const API_BASE = '/api/kim/admin/providers';

function getToken() { return document.getElementById('adminToken').value.trim(); }

function toast(msg, ok = true) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.background = ok ? '#166534' : '#dc2626';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

async function loadProviders() {
  try {
    const res = await fetch(API_BASE, { headers: { 'x-admin-token': getToken() } });
    const data = await res.json();
    if (!data.ok) throw new Error(data.message || 'Load failed');
    renderProviders(data.providers || []);
  } catch (e) {
    document.getElementById('providerList').innerHTML = `<div class="text-red-500 text-center py-4">Lỗi: ${e.message}</div>`;
  }
}

function renderProviders(providers) {
  const container = document.getElementById('providerList');
  if (!providers.length) {
    container.innerHTML = '<div class="text-center py-8 text-slate-400">Chưa có provider nào. Nhấn "+ Thêm Provider" để bắt đầu.</div>';
    return;
  }
  container.innerHTML = providers.map(p => `
    <div class="card p-4">
      <div class="flex items-start justify-between">
        <div>
          <div class="flex items-center gap-2">
            <span class="font-semibold text-slate-900">${esc(p.name)}</span>
            <span class="badge ${p.is_active ? 'badge-active' : 'badge-inactive'}">${p.is_active ? 'Active' : 'Inactive'}</span>
            <span class="text-xs text-slate-400">priority: ${p.priority}</span>
          </div>
          <div class="text-sm text-slate-500 mt-1">${esc(p.base_url)}</div>
          <div class="text-xs text-slate-400 mt-1">Models: ${(p.models || []).length} · Key: ${p.api_key_masked || '***'}</div>
          <div class="text-xs text-slate-400 mt-1 flex flex-wrap gap-1">
            ${(p.models || []).map(m => `<span class="badge" style="background:#f1f5f9;color:#475569">${esc(m.id)} (${(m.roles||[]).join(', ')})</span>`).join('')}
          </div>
        </div>
        <div class="flex gap-1">
          <button class="btn btn-sm" style="background:#f1f5f9" onclick="editProvider('${p.id}')">Sửa</button>
          <button class="btn btn-sm btn-danger" onclick="deleteProvider('${p.id}','${esc(p.name)}')">Xóa</button>
        </div>
      </div>
    </div>
  `).join('');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function showAddForm() {
  document.getElementById('formTitle').textContent = 'Thêm Provider mới';
  document.getElementById('editId').value = '';
  document.getElementById('fName').value = '';
  document.getElementById('fBaseUrl').value = 'https://api.xkiro.com/v1';
  document.getElementById('fApiKey').value = '';
  document.getElementById('fModels').value = '[\n  {"id":"deepseek/deepseek-v4-pro","roles":["orchestrator"]},\n  {"id":"xiaomi/mimo-v2.5-pro","roles":["vision"]}\n]';
  document.getElementById('fPriority').value = '0';
  document.getElementById('fActive').checked = true;
  document.getElementById('providerForm').classList.remove('hidden');
}

function hideForm() { document.getElementById('providerForm').classList.add('hidden'); }

async function editProvider(id) {
  try {
    const res = await fetch(`${API_BASE}?id=${id}`, { headers: { 'x-admin-token': getToken() } });
    const data = await res.json();
    if (!data.ok) throw new Error(data.message);
    const p = data.provider;
    document.getElementById('formTitle').textContent = 'Sửa Provider: ' + p.name;
    document.getElementById('editId').value = id;
    document.getElementById('fName').value = p.name;
    document.getElementById('fBaseUrl').value = p.base_url;
    document.getElementById('fApiKey').value = '';
    document.getElementById('fApiKey').placeholder = 'Để trống = giữ nguyên key cũ';
    document.getElementById('fModels').value = JSON.stringify(p.models || [], null, 2);
    document.getElementById('fPriority').value = p.priority || 0;
    document.getElementById('fActive').checked = p.is_active !== false;
    document.getElementById('providerForm').classList.remove('hidden');
  } catch (e) { toast(e.message, false); }
}

async function saveProvider() {
  const id = document.getElementById('editId').value;
  let models;
  try { models = JSON.parse(document.getElementById('fModels').value); } catch { toast('Models JSON không hợp lệ', false); return; }
  const body = {
    name: document.getElementById('fName').value.trim(),
    base_url: document.getElementById('fBaseUrl').value.trim(),
    models,
    priority: Number(document.getElementById('fPriority').value) || 0,
    is_active: document.getElementById('fActive').checked
  };
  const apiKey = document.getElementById('fApiKey').value.trim();
  if (apiKey) body.api_key = apiKey;

  try {
    const url = id ? `${API_BASE}/${id}` : API_BASE;
    const method = id ? 'PUT' : 'POST';
    const res = await fetch(url, {
      method, headers: { 'content-type': 'application/json', 'x-admin-token': getToken() },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.message || 'Save failed');
    toast(id ? 'Đã cập nhật!' : 'Đã thêm!');
    hideForm();
    loadProviders();
  } catch (e) { toast(e.message, false); }
}

async function deleteProvider(id, name) {
  if (!confirm(`Xóa provider "${name}"?`)) return;
  try {
    const res = await fetch(`${API_BASE}/${id}`, { method: 'DELETE', headers: { 'x-admin-token': getToken() } });
    const data = await res.json();
    if (!data.ok) throw new Error(data.message);
    toast('Đã xóa!');
    loadProviders();
  } catch (e) { toast(e.message, false); }
}

loadProviders();
</script>
</body>
</html>
